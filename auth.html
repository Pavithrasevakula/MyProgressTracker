<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MyProgressTrack - Sign In</title>
<style>
:root{
  --bg:#eef4f0;--surface:#ffffff;--ink:#1d2b25;--muted:#66756d;
  --line:#d9e4de;--green:#4f8b6c;--green2:#2f6d50;--mint:#e5f1e9;
  --shadow:0 24px 70px rgba(35,60,47,.12);--radius:18px;
}
*{box-sizing:border-box}
body{
  margin:0;background:radial-gradient(circle at 15% 10%,#dcefe3 0,#eef4f0 42%,#e5efe9 100%);
  color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif;
  display:grid;place-items:center;min-height:100vh;padding:20px;
}
.auth-box{
  width:min(460px,100%);background:var(--surface);border-radius:22px;
  box-shadow:var(--shadow);padding:44px 40px;border:1px solid rgba(255,255,255,.8);
  animation:slideUp 0.4s ease-out;
}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.logo-header{text-align:center;margin-bottom:32px}
.logo{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#6d9b83,#47765f);
  color:#fff;display:inline-grid;place-items:center;font-weight:800;font-size:32px;
  margin-bottom:16px;box-shadow:0 8px 20px rgba(71,118,95,.25)}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:18px}
h1{margin:0;font-size:26px;letter-spacing:-.02em;font-weight:800}
.tagline{color:var(--muted);font-size:13px;margin-top:8px;font-weight:500;letter-spacing:.02em}
.btn{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;
  padding:13px 18px;cursor:pointer;font:inherit;width:100%;font-weight:600;
  transition:all 0.2s;font-size:15px}
.btn:hover{border-color:#9abca8;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.btn.primary{background:linear-gradient(135deg,#6d9b83,#5a8a70);color:white;border:0;
  box-shadow:0 4px 16px rgba(71,118,95,.3)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(71,118,95,.4)}
.btn.google{background:#fff;border:1.5px solid var(--line);display:flex;
  align-items:center;justify-content:center;gap:10px;margin-top:16px;font-size:14px}
.btn.google:hover{background:#f8fbf9;border-color:#8db79c;box-shadow:0 8px 18px rgba(35,60,47,.08)}
.btn:focus-visible{outline:3px solid rgba(109,155,131,.35);outline-offset:2px}
.error{background:#fce8e8;color:#a65c5c;padding:12px 16px;border-radius:11px;
  font-size:13px;margin-bottom:18px;display:none;border-left:3px solid #bd6f6f}
.error.show{display:block;animation:shake 0.3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.info{background:#eaf4ee;color:var(--green2);padding:12px 16px;border-radius:11px;
  font-size:13px;margin-bottom:18px;border-left:3px solid var(--green)}
.forgot-link{text-align:right;margin-top:10px}
.forgot-link a{color:var(--green2);text-decoration:none;font-size:13px;font-weight:600}
.forgot-link a:hover{text-decoration:underline}
.loading{display:none;text-align:center;padding:24px;color:var(--muted)}
.loading.show{display:block}
.loading::after{content:"";display:inline-block;width:16px;height:16px;
  border:2px solid #e8f0ec;border-top-color:var(--green);border-radius:50%;
  animation:spin 0.6s linear infinite;margin-left:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:480px){
  .auth-box{padding:32px 24px}
  h1{font-size:22px}
  .logo{width:64px;height:64px;font-size:28px}
}
@media(max-width:360px){
  body{padding:12px}
  .auth-box{padding:26px 18px;border-radius:18px}
  .logo-header{margin-bottom:26px}
}
</style>
<style>
:root{--bg:#f5f6fa;--surface:#ffffff;--ink:#252936;--muted:#737887;--line:#e1e4ec;--green:#6472a8;--green2:#4f5d93;--mint:#e8ebf7}
body{background:radial-gradient(circle at 15% 10%,#e8ebf7 0,#f5f6fa 42%,#edf0f8 100%)}
.logo{background:linear-gradient(135deg,#6472a8,#4f5d93)}.btn.primary{background:linear-gradient(135deg,#6472a8,#4f5d93)}.btn.google:hover{background:#fbfbfd;border-color:#c8cee3}.info{background:#edf0f8;color:var(--green2);border-left-color:var(--green)}
</style>
</head>
<body>

<div class="auth-box">
  <div class="logo-header">
    <div class="logo"><img src="icon.png" alt="Logo"></div>
    <h1>Welcome to MyProgressTrack</h1>
    <p class="tagline">Study • Career • Life</p>
  </div>

  <div id="errorMsg" class="error"></div>

  <div class="info">Use your Google account to sign in. Your planner data follows you automatically on every device.</div>
  <button class="btn google" onclick="signInWithGoogle()" style="margin-top:20px">
    <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
    Continue with Google
  </button>

  <div class="loading" id="loading">
    <p>Signing you in securely...</p>
  </div>
</div>

<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup }
from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
import { getFirestore, doc, setDoc, getDoc }
from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

// Initialize Firebase
const app = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
}

function hideError() {
  document.getElementById('errorMsg').classList.remove('show');
}

function showLoading() {
  document.getElementById('loading').classList.add('show');
  document.querySelectorAll('.btn').forEach(b => b.disabled = true);
}

function hideLoading() {
  document.getElementById('loading').classList.remove('show');
  document.querySelectorAll('.btn').forEach(b => b.disabled = false);
}

// Google Sign In
window.signInWithGoogle = async function() {
  hideError();
  showLoading();
  
  const provider = new GoogleAuthProvider();
  
  try {
    const result = await signInWithPopup(auth, provider);
    const user = result.user;
    console.log('Google sign in:', user.uid);
    
    // Create the user's shared planner document on first Google sign-in.
    const docRef = doc(db, 'users', user.uid, 'planner', 'data');
    const docSnap = await getDoc(docRef);
    
    if (!docSnap.exists()) {
      await setDoc(docRef, {
        profile: { name: user.displayName || 'User' },
        createdAt: new Date().toISOString(),
        lastSync: new Date().toISOString()
      });
    }
    
    // Redirect to main app
    window.location.href = 'index.html';
  } catch (error) {
    console.error('Google sign in error:', error);
    let msg = 'Google sign in failed. Please try again.';
    if (error.code === 'auth/popup-closed-by-user') msg = 'Sign in cancelled.';
    if (error.code === 'auth/popup-blocked') msg = 'Popup blocked. Please allow popups for this site.';
    showError(msg);
    hideLoading();
  }
}

// Check if already signed in
auth.onAuthStateChanged((user) => {
  if (user && !window.location.search.includes('force')) {
    // Already signed in, redirect to main app
    window.location.href = 'index.html';
  }
});
</script>

</body>
</html>
